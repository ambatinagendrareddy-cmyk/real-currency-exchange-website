<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - World Currency Exchange</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


<div class="auth-container">

    <div class="auth-box">

        <div class="auth-logo">
            🌍
        </div>

        <h1>
            World Currency Exchange
        </h1>

        <h2>
            Create Account
        </h2>

        <p class="auth-subtitle">
            Register to use the currency exchange application
        </p>


        <form id="registerForm">

            <div class="auth-input">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="auth-input">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="auth-input">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="auth-input">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <p
            id="registerMessage"
            class="auth-message"
        ></p>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
