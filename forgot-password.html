<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | World Currency Exchange</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="background-effects">
        <span class="glow glow-one"></span>
        <span class="glow glow-two"></span>
        <span class="glow glow-three"></span>
    </div>

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">🌍</div>

                <div>
                    <h1>WORLD CURRENCY</h1>
                    <span>EXCHANGE</span>
                </div>
            </div>

            <div class="auth-heading">
                <h2>Reset Password</h2>
                <p>Create a new password for your account.</p>
            </div>

            <form id="forgotForm" autocomplete="off" novalidate>

                <div class="form-group">

                    <label for="resetEmail">Registered Email</label>

                    <div class="input-wrapper">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="resetEmail"
                            name="resetEmail"
                            placeholder="Enter your registered email"
                            autocomplete="off"
                            value=""
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="newPassword">New Password</label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            value=""
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label for="newPasswordConfirm">Confirm New Password</label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔐</span>

                        <input
                            type="password"
                            id="newPasswordConfirm"
                            name="newPasswordConfirm"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            value=""
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPasswordConfirm"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <div id="forgotMessage" class="form-message"></div>

                <button type="submit" class="primary-button">
                    <span>Reset Password</span>
                    <span>→</span>
                </button>

            </form>

            <div class="back-login">
                <a href="login.html">
                    ← Back to Login
                </a>
            </div>

            <footer class="auth-footer">
                © 2026 World Currency Exchange
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>s
